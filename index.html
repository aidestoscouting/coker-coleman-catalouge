<!DOCTYPE html>
<html lang="en" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coker Shop App</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: { 
                        coleman: '#DA291C',
                        wood: {
                            100: '#F5F0E6', 200: '#E6D5B8', 300: '#CBA36F',
                            400: '#9b7647', 500: '#7a5a34', 600: '#644829',
                            700: '#5C4033', 800: '#3E2723', 900: '#2D1C15',
                        },
                        forest: { 800: '#143109' }
                    },
                    fontFamily: { 'slab': ['"Roboto Slab"', 'serif'] }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Roboto+Slab:wght@500;700;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #991B1B;
            background-image: url("data:image/svg+xml,%3Csvg width='80' height='80' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M0 0h40v40H0zM40 40h40v40H40z' fill='%23000' fill-opacity='0.4'/%3E%3Cpath d='M0 40h40v40H0zM40 0h40v40H40z' fill='%23000' fill-opacity='0.15'/%3E%3C/svg%3E");
            background-attachment: fixed;
            transition: background-color 0.3s ease;
            color: #E6D5B8;
        }
        .dark body { background-color: #450a0a; background-image: url("data:image/svg+xml,%3Csvg width='80' height='80' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M0 0h40v40H0zM40 40h40v40H40z' fill='%23000' fill-opacity='0.6'/%3E%3Cpath d='M0 40h40v40H0zM40 0h40v40H40z' fill='%23000' fill-opacity='0.25'/%3E%3C/svg%3E"); }
        .coleman-red { background-color: #DA291C; }
        .text-coleman-red { color: #DA291C; }
        .tab-active { border-bottom: 4px solid #DA291C; color: #DA291C; font-weight: 800; }
        .dark .tab-active { color: #ffadad; border-color: #ffadad; }
        .tab-inactive { color: #CBA36F !important; border-bottom: 4px solid transparent; }
        .dark .tab-inactive { color: #CBA36F !important; }
        .tab-inactive:hover { color: #DA291C !important; border-color: #ffadad; }
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: rgba(0,0,0,0.2); }
        ::-webkit-scrollbar-thumb { background: #5C4033; border-radius: 4px; }
        .dark ::-webkit-scrollbar-thumb { background: #3E2723; }
        .condition-btn.selected { background-color: #DA291C !important; color: white !important; border-color: #991b1b !important; box-shadow: inset 0 2px 4px rgba(0,0,0,0.3); }
        .toast-enter { animation: slideUpFade 0.4s ease-out forwards; }
        @keyframes slideUpFade { from { opacity: 0; transform: translateY(100%) translateX(-50%); } to { opacity: 1; transform: translateY(0) translateX(-50%); } }
        .repair-tag { transition: all 0.2s ease; cursor: pointer; }
        .bg-wood-100, .bg-white, .dark\:bg-wood-800 { background-color: #3E2723 !important; } 
        .bg-wood-200, .dark\:bg-wood-900, .bg-wood-50 { background-color: #2D1C15 !important; } 
        .bg-forest-800 { background-color: #1a100c !important; } 
        .text-wood-900, .text-wood-800, .text-black, .dark\:text-wood-100, .dark\:text-wood-50, .dark\:text-white { color: #F5F0E6 !important; } 
        .text-wood-700, .text-wood-600, .dark\:text-wood-200, .dark\:text-wood-300, .dark\:text-wood-400 { color: #CBA36F !important; } 
        .border-wood-300, .border-wood-400, .dark\:border-wood-700, .dark\:border-wood-600 { border-color: #5C4033 !important; }
        input, select, textarea { background-color: #1a100c !important; color: #F5F0E6 !important; border-color: #5C4033 !important; }
        .card-texture { background-image: url("data:image/svg+xml,%3Csvg width='100' height='100' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100' height='100' filter='url(%23noise)' opacity='0.03'/%3E%3C/svg%3E"); }
    </style>
</head>
<body class="min-h-screen flex flex-col text-wood-200 relative pb-16 md:pb-0">

    <!-- Floating Action Button for Mobile -->
    <button onclick="openAddGearModal()" class="md:hidden fixed bottom-6 right-6 w-16 h-16 bg-coleman-red text-white rounded-full shadow-[0_10px_25px_rgba(0,0,0,0.5)] border-4 border-red-900 flex items-center justify-center z-40 active:bg-red-800 active:scale-90 transition-all">
        <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M12 4v16m8-8H4"></path></svg>
    </button>

    <!-- Toast Container -->
    <div id="toast-container" class="fixed bottom-24 md:bottom-10 left-1/2 z-[110] flex flex-col gap-2 pointer-events-none"></div>

    <!-- Header Section -->
    <header class="bg-wood-100 dark:bg-wood-800 shadow-xl border-b-4 border-dashed border-wood-400 dark:border-wood-600 relative z-10">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4 flex justify-between items-center">
            <div class="flex items-center gap-3 bg-wood-200 dark:bg-wood-900 p-2 sm:pr-6 rounded-xl shadow-[inset_0_2px_8px_rgba(0,0,0,0.6)] border-2 border-wood-300 dark:border-wood-700">
                <img src="COKERMANPATCH LOGO.png" alt="Coker Logo" class="h-12 sm:h-16 w-auto drop-shadow-md rounded" onerror="this.src='https://placehold.co/200x80/7a5a34/F5F0E6?text=COKER+LOGO'">
                <div class="hidden sm:block">
                    <h1 class="text-2xl font-slab font-black text-wood-900 dark:text-wood-50 tracking-tight drop-shadow-sm uppercase">Coker Family</h1>
                    <p class="text-xs font-bold text-wood-700 dark:text-wood-400 tracking-widest uppercase">Gear & Repair Log</p>
                </div>
            </div>
            <div class="flex items-center gap-4">
                <button onclick="exportCSV()" class="hidden sm:flex items-center gap-2 p-2 rounded-md bg-green-900 hover:bg-green-800 text-white transition-colors border border-green-950 shadow-inner text-xs font-bold uppercase tracking-widest" title="Backup Database">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
                    CSV Backup
                </button>
                <div id="sync-status" class="hidden sm:flex items-center gap-2 text-xs font-bold text-wood-600 uppercase tracking-widest bg-wood-200 px-3 py-1 rounded-full border border-wood-400">
                    <span class="w-2 h-2 rounded-full bg-green-500 animate-pulse"></span> Offline/Local
                </div>
                <button onclick="forceSync()" class="p-2 rounded-md bg-blue-900 hover:bg-blue-800 text-white transition-colors border border-blue-950 shadow-inner" title="Force Cloud Sync">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
                </button>
                <button onclick="toggleDarkMode()" class="hidden sm:block p-2 rounded-md bg-wood-700 hover:bg-wood-800 text-yellow-400 transition-colors border border-wood-900 shadow-inner">
                    <svg class="w-6 h-6 block dark:hidden text-wood-200" fill="currentColor" viewBox="0 0 20 20"><path d="M17.293 13.293A8 8 0 016.707 2.707a8.001 8.001 0 1010.586 10.586z"></path></svg>
                    <svg class="w-6 h-6 hidden dark:block text-orange-400" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M10 2a1 1 0 011 1v1a1 1 0 11-2 0V3a1 1 0 011-1zm4 8a4 4 0 11-8 0 4 4 0 018 0zm-.464 4.95l.707.707a1 1 0 001.414-1.414l-.707-.707a1 1 0 00-1.414 1.414zm2.12-10.607a1 1 0 010 1.414l-.706.707a1 1 0 11-1.414-1.414l.707-.707a1 1 0 011.414 0zM17 11a1 1 0 100-2h-1a1 1 0 100 2h1zm-7 4a1 1 0 011 1v1a1 1 0 11-2 0v-1a1 1 0 011-1zM5.05 6.464A1 1 0 106.465 5.05l-.708-.707a1 1 0 00-1.414 1.414l.707.707zm1.414 8.486l-.707.707a1 1 0 01-1.414-1.414l.707-.707a1 1 0 011.414 1.414zM4 11a1 1 0 100-2H3a1 1 0 000 2h1z" clip-rule="evenodd"></path></svg>
                </button>
            </div>
        </div>

        <nav class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex space-x-8 mt-2 overflow-x-auto border-b-2 border-wood-700/50">
            <button onclick="switchTab('collection')" id="tab-collection" class="tab-active pb-3 px-2 whitespace-nowrap transition-colors duration-200 uppercase tracking-wide">Shop Inventory</button>
            <button onclick="switchTab('parts')" id="tab-parts" class="tab-inactive pb-3 px-2 whitespace-nowrap transition-colors duration-200 uppercase tracking-wide font-bold">Parts & Reference</button>
        </nav>
    </header>

    <main class="flex-grow max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 w-full">
        <!-- SECTION: My Collection -->
        <section id="section-collection" class="block">
            <div class="flex flex-col sm:flex-row justify-between items-center mb-6 gap-4 bg-wood-100 dark:bg-wood-800 p-4 rounded-xl shadow-[0_8px_30px_rgba(0,0,0,0.5)] border-2 border-wood-300 dark:border-wood-700 card-texture">
                <h2 class="text-2xl sm:text-3xl font-slab font-black text-wood-900 dark:text-wood-100 drop-shadow-sm whitespace-nowrap">Logged Gear (<span id="item-count">0</span>)</h2>
                
                <div class="flex-grow max-w-lg w-full mx-0 sm:mx-4">
                    <div class="relative group">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                            <svg class="h-5 w-5 text-wood-500 group-focus-within:text-coleman transition-colors" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
                        </div>
                        <input type="text" id="inventory-search" oninput="renderCollection()" placeholder="Search model, owner, or status..." class="w-full pl-10 pr-10 py-3 border-2 border-wood-400 dark:border-wood-600 rounded-lg bg-wood-200 dark:bg-wood-900 text-wood-900 dark:text-white placeholder-wood-500 focus:outline-none focus:border-coleman font-bold shadow-inner text-sm transition-colors">
                    </div>
                </div>

                <div class="flex flex-wrap items-center justify-center gap-2">
                    <button onclick="openAddGearModal()" class="hidden md:flex coleman-red text-white px-5 py-3 rounded-lg shadow-lg border-b-4 border-red-900 active:border-b-0 active:mt-1 hover:bg-red-700 transition-all text-sm font-black items-center gap-2 uppercase tracking-wider">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M12 6v6m0 0v6m0-6h6m-6 0H6"></path></svg>
                        Add Gear
                    </button>
                </div>
            </div>
            
            <div id="collection-container" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6"></div>
        </section>

        <!-- SECTION: Parts -->
        <section id="section-parts" class="hidden space-y-8">
            <div class="bg-wood-100 dark:bg-wood-800 rounded-xl p-6 sm:p-8 border-2 border-wood-300 dark:border-wood-700 shadow-[inset_0_2px_10px_rgba(0,0,0,0.5)] card-texture">
                <h3 class="text-3xl font-slab font-black text-wood-900 dark:text-white uppercase tracking-tight mb-6">Shop Parts Inventory</h3>
                <div class="flex flex-col sm:flex-row gap-2 mb-6 p-4 bg-wood-200 dark:bg-wood-900 rounded-lg border border-wood-300 dark:border-wood-700 shadow-inner">
                    <input type="text" id="new-part-name" placeholder="Enter part name..." class="flex-grow p-3 rounded-lg border-2 border-wood-400 dark:border-wood-600 bg-white dark:bg-wood-800 font-bold shadow-inner">
                    <input type="number" id="new-part-qty" value="1" class="w-full sm:w-24 p-3 rounded-lg border-2 border-wood-400 dark:border-wood-600 bg-white dark:bg-wood-800 font-bold shadow-inner text-center">
                    <button onclick="addInventoryPart()" class="bg-forest-800 text-white px-6 py-3 rounded-lg font-black uppercase tracking-wider">+ Add Part</button>
                </div>
                <div id="parts-inventory-list" class="space-y-3"></div>
            </div>
        </section>

        <!-- MODAL: ADD GEAR -->
        <div id="add-gear-modal" class="hidden fixed inset-0 bg-wood-900 bg-opacity-95 z-50 flex items-end sm:items-center justify-center sm:p-4 overflow-y-auto backdrop-blur-md">
            <div class="bg-wood-100 dark:bg-wood-800 w-full sm:max-w-2xl rounded-t-3xl sm:rounded-2xl shadow-[0_20px_50px_rgba(0,0,0,0.7)] overflow-hidden max-h-[95vh] flex flex-col border-4 border-wood-400 dark:border-wood-700 card-texture">
                <div class="px-6 py-5 border-b-4 border-wood-400 dark:border-wood-700 flex justify-between items-center bg-wood-200 dark:bg-wood-900 shadow-md z-10">
                    <h3 class="text-2xl font-slab font-black text-wood-900 dark:text-wood-100 tracking-wide uppercase">Log Shop Gear</h3>
                    <button onclick="closeAddGearModal()" class="text-wood-600 hover:text-coleman p-2"><svg class="h-8 w-8" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M6 18L18 6M6 6l12 12"/></svg></button>
                </div>
                <div class="p-6 overflow-y-auto flex-grow space-y-6">
                    <!-- Dual Camera -->
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                        <div class="flex flex-col items-center justify-center w-full">
                            <label class="block text-xs font-black uppercase tracking-wider mb-2 w-full text-center">Main Profile</label>
                            <label for="gear-photo-upload" class="flex flex-col items-center justify-center w-full h-56 border-4 border-wood-400 border-dashed rounded-xl cursor-pointer bg-wood-50 relative overflow-hidden">
                                <div id="gear-photo-placeholder" class="flex flex-col items-center justify-center pt-5 pb-6">
                                    <svg class="w-10 h-10 mb-3 text-wood-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z"/><circle cx="12" cy="13" r="3" stroke-width="2"/></svg>
                                    <p class="text-xs uppercase tracking-widest text-wood-800 font-black">Snap Profile</p>
                                </div>
                                <img id="gear-photo-preview" class="hidden absolute inset-0 w-full h-full object-contain backdrop-blur-xl bg-wood-900/30 p-2">
                                <input id="gear-photo-upload" type="file" class="hidden" accept="image/*" capture="environment" onchange="processAndCompressImage(event, 'primary')">
                            </label>
                        </div>
                        <div class="flex flex-col items-center justify-center w-full">
                            <label class="block text-xs font-black uppercase tracking-wider mb-2 w-full text-center">Bottom / Date Stamp</label>
                            <label for="gear-photo-upload-bottom" class="flex flex-col items-center justify-center w-full h-56 border-4 border-wood-400 border-dashed rounded-xl cursor-pointer bg-wood-50 relative overflow-hidden">
                                <div id="gear-photo-placeholder-bottom" class="flex flex-col items-center justify-center pt-5 pb-6">
                                    <svg class="w-10 h-10 mb-3 text-wood-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7v8a2 2 0 002 2h6M8 7V5a2 2 0 012-2h4.586a1 1 0 01.707.293l4.414 4.414a1 1 0 01.293.707V15a2 2 0 01-2 2h-2M8 7H6a2 2 0 00-2 2v10a2 2 0 002 2h8a2 2 0 002-2v-2"></path></svg>
                                    <p class="text-xs uppercase tracking-widest text-wood-800 font-black">Snap Bottom</p>
                                </div>
                                <img id="gear-photo-preview-bottom" class="hidden absolute inset-0 w-full h-full object-contain backdrop-blur-xl bg-wood-900/30 p-2">
                                <input id="gear-photo-upload-bottom" type="file" class="hidden" accept="image/*" capture="environment" onchange="processAndCompressImage(event, 'bottom')">
                            </label>
                        </div>
                    </div>
                    <!-- Autocomplete Model & Dates -->
                    <div class="bg-wood-200 dark:bg-wood-900 p-4 rounded-xl border-2 border-wood-400 dark:border-wood-700 space-y-4">
                        <div>
                            <label class="block text-xs font-black uppercase tracking-wider mb-1">Model / Name</label>
                            <input type="text" id="gear-model" placeholder="e.g. 200A" oninput="checkColemanBrain()" class="w-full p-4 rounded-lg border-2 border-wood-400 font-black text-xl">
                            <div id="brain-specs" class="hidden mt-2 p-3 bg-forest-800 border-2 border-green-900 rounded-lg shadow-inner text-green-200 text-xs font-bold uppercase tracking-widest grid grid-cols-2 gap-2">
                                <div>Gen: <span id="brain-gen" class="text-white"></span></div>
                                <div>Fuel: <span id="brain-fuel" class="text-white"></span></div>
                                <div>Mantle: <span id="brain-mantle" class="text-white"></span></div>
                                <div class="col-span-2 text-[10px]">Notes: <span id="brain-notes" class="text-white"></span></div>
                            </div>
                        </div>
                        <div class="grid grid-cols-2 gap-4">
                            <div>
                                <label class="block text-xs font-black uppercase tracking-wider mb-1">Date (Month)</label>
                                <input type="number" id="gear-month" placeholder="MM" oninput="if(this.value.length >= 2) document.getElementById('gear-year').focus()" class="w-full p-4 rounded-lg border-2 border-wood-400 text-center font-black text-xl" inputmode="numeric">
                            </div>
                            <div>
                                <label class="block text-xs font-black uppercase tracking-wider mb-1">Date (Year)</label>
                                <input type="number" id="gear-year" placeholder="YY" class="w-full p-4 rounded-lg border-2 border-wood-400 text-center font-black text-xl" inputmode="numeric">
                            </div>
                        </div>
                    </div>
                    <!-- Shop Tracking & Notes -->
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 bg-wood-200 p-4 rounded-xl border-2 border-wood-400">
                        <div>
                            <label class="block text-xs font-black uppercase tracking-wider mb-1">Customer / Owner</label>
                            <input type="text" id="gear-owner" value="COKER GEAR" class="w-full p-3 rounded-lg border-2 border-wood-400 font-bold text-base">
                        </div>
                        <div class="flex items-center mt-1 sm:mt-6">
                            <label class="flex items-center gap-3 p-2 bg-wood-100 rounded border border-wood-300 w-full">
                                <input type="checkbox" id="gear-priority" class="w-6 h-6 rounded border-2 border-wood-400 accent-coleman-red">
                                <span class="text-sm font-black text-red-700 uppercase tracking-widest">Rush Job</span>
                            </label>
                        </div>
                        <div class="sm:col-span-2">
                            <label class="block text-xs font-black uppercase tracking-wider mb-1">Work Log / Customer Notes</label>
                            <textarea id="gear-notes" rows="2" class="w-full p-3 rounded-lg border-2 border-wood-400 font-bold text-sm resize-none"></textarea>
                        </div>
                        <div class="sm:col-span-2">
                            <label class="block text-xs font-black uppercase tracking-wider mb-2">Diagnostic / Repair Needs</label>
                            <div id="repair-tags-container" class="flex flex-wrap gap-2">
                                <button type="button" class="repair-tag border-2 border-wood-400 text-wood-600 rounded px-3 py-1.5 text-xs font-black uppercase tracking-wider shadow-sm hover:border-coleman" onclick="toggleRepairTag(this)">Pump Leather</button>
                                <button type="button" class="repair-tag border-2 border-wood-400 text-wood-600 rounded px-3 py-1.5 text-xs font-black uppercase tracking-wider shadow-sm hover:border-coleman" onclick="toggleRepairTag(this)">Check Valve</button>
                                <button type="button" class="repair-tag border-2 border-wood-400 text-wood-600 rounded px-3 py-1.5 text-xs font-black uppercase tracking-wider shadow-sm hover:border-coleman" onclick="toggleRepairTag(this)">Generator</button>
                                <button type="button" class="repair-tag border-2 border-wood-400 text-wood-600 rounded px-3 py-1.5 text-xs font-black uppercase tracking-wider shadow-sm hover:border-coleman" onclick="toggleRepairTag(this)">Cap Gasket</button>
                                <button type="button" class="repair-tag border-2 border-wood-400 text-wood-600 rounded px-3 py-1.5 text-xs font-black uppercase tracking-wider shadow-sm hover:border-coleman" onclick="toggleRepairTag(this)">Valve Packing</button>
                                <button type="button" class="repair-tag border-2 border-wood-400 text-wood-600 rounded px-3 py-1.5 text-xs font-black uppercase tracking-wider shadow-sm hover:border-coleman" onclick="toggleRepairTag(this)">Fount Rust / Flush</button>
                                <button type="button" class="repair-tag border-2 border-wood-400 text-wood-600 rounded px-3 py-1.5 text-xs font-black uppercase tracking-wider shadow-sm hover:border-coleman" onclick="toggleRepairTag(this)">Missing Globe</button>
                                <button type="button" class="repair-tag border-2 border-wood-400 text-wood-600 rounded px-3 py-1.5 text-xs font-black uppercase tracking-wider shadow-sm hover:border-coleman" onclick="toggleRepairTag(this)">Schrader Valve</button>
                            </div>
                        </div>
                    </div>
                    <div>
                        <label class="block text-xs font-black uppercase tracking-wider mb-2">Shop Status</label>
                        <select id="gear-op-status" class="w-full p-4 rounded-lg border-2 border-wood-400 text-lg font-black uppercase">
                            <option value="Intake / In Queue">Intake / In Queue</option>
                            <option value="On the Bench">On the Bench (Active)</option>
                            <option value="Waiting on Parts">Waiting on Parts</option>
                            <option value="Completed / Ready">Completed / Ready</option>
                        </select>
                    </div>
                    <div class="pt-4 pb-8 sm:pb-2">
                        <button onclick="saveNewGear()" class="w-full coleman-red text-white font-black py-4 px-4 rounded-xl shadow-lg border-b-4 border-red-900 active:border-b-0 active:translate-y-1 hover:bg-red-700 transition-all text-xl uppercase tracking-widest">
                            Save Job
                        </button>
                    </div>
                </div>
            </div>
        </div>

    </main>

    <!-- MICRO-CLOUD LOGIC (JSONBIN.IO) -->
    <script>
        // --- MICRO CLOUD CONFIGURATION ---
        const JSONBIN_MASTER_KEY = "$2a$10$kO.d9vMG7Nkt6CvP.XNZsen04IZ4XKmvOXu51ax6awGzHMZTt4t2q";
        const JSONBIN_BIN_ID = "6aff6b14ffd5d16053cf98e5";

        window.myCollection = [];
        window.shopInventory = []; 
        let primaryPhotoDataUrl = null, bottomPhotoDataUrl = null;

        function toggleRepairTag(el) {
            el.classList.toggle('selected-tag');
            el.classList.toggle('bg-red-900');
            el.classList.toggle('text-white');
            el.classList.toggle('border-red-900');
            el.classList.toggle('text-wood-600');
            el.classList.toggle('border-wood-400');
        }

        window.onload = function() {
            if (localStorage.theme === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                document.documentElement.classList.add('dark');
            } else {
                document.documentElement.classList.remove('dark');
            }
            loadData(); // Will attempt cloud first, then fallback to local
        };

        function toggleDarkMode() {
            if (document.documentElement.classList.contains('dark')) {
                document.documentElement.classList.remove('dark');
                localStorage.theme = 'light';
            } else {
                document.documentElement.classList.add('dark');
                localStorage.theme = 'dark';
            }
        }

        // --- CLOUD SYNC ENGINE ---
        async function loadData() {
            const statusEl = document.getElementById('sync-status');
            if (JSONBIN_BIN_ID && JSONBIN_BIN_ID !== "YOUR_BIN_ID_HERE") {
                try {
                    statusEl.innerHTML = `<span class="w-2 h-2 rounded-full bg-yellow-500 animate-pulse"></span> Syncing...`;
                    let req = await fetch(`https://api.jsonbin.io/v3/b/${JSONBIN_BIN_ID}/latest`, {
                        headers: { 'X-Master-Key': JSONBIN_MASTER_KEY }
                    });
                    let res = await req.json();
                    if(res.record) {
                        window.myCollection = res.record.gear || [];
                        window.shopInventory = res.record.inventory || [];
                        statusEl.innerHTML = `<span class="w-2 h-2 rounded-full bg-blue-400"></span> Cloud Synced`;
                    }
                } catch (e) {
                    console.error("Cloud load failed, using local", e);
                    loadLocalFallback();
                    statusEl.innerHTML = `<span class="w-2 h-2 rounded-full bg-red-500"></span> Cloud Error`;
                }
            } else {
                loadLocalFallback();
            }
            renderCollection();
            renderInventory();
        }

        async function syncToCloud() {
            const statusEl = document.getElementById('sync-status');
            
            // Always save to local storage immediately as a backup
            localStorage.setItem('cokerCollection', JSON.stringify(window.myCollection));
            localStorage.setItem('cokerPartsInventory', JSON.stringify(window.shopInventory));

            if (JSONBIN_BIN_ID && JSONBIN_BIN_ID !== "YOUR_BIN_ID_HERE") {
                statusEl.innerHTML = `<span class="w-2 h-2 rounded-full bg-yellow-500 animate-pulse"></span> Saving...`;
                try {
                    await fetch(`https://api.jsonbin.io/v3/b/${JSONBIN_BIN_ID}`, {
                        method: 'PUT',
                        headers: {
                            'Content-Type': 'application/json',
                            'X-Master-Key': JSONBIN_MASTER_KEY
                        },
                        body: JSON.stringify({ gear: window.myCollection, inventory: window.shopInventory })
                    });
                    statusEl.innerHTML = `<span class="w-2 h-2 rounded-full bg-blue-400"></span> Cloud Synced`;
                } catch (e) {
                    console.error("Cloud save failed", e);
                    statusEl.innerHTML = `<span class="w-2 h-2 rounded-full bg-red-500"></span> Save Failed`;
                    showToast("Cloud Save Failed. Saved Locally.");
                }
            }
        }

        function forceSync() { showToast("Fetching Cloud Data..."); loadData(); }

        function loadLocalFallback() {
            const savedGear = localStorage.getItem('cokerCollection');
            if (savedGear) window.myCollection = JSON.parse(savedGear);
            const savedInv = localStorage.getItem('cokerPartsInventory');
            if (savedInv) window.shopInventory = JSON.parse(savedInv);
            
            // Auto-seed base inventory if completely empty
            if (window.shopInventory.length === 0) {
                window.shopInventory = [
                    { id: 'inv_1', name: '#21 Mantles (Tie)', qty: 0 },
                    { id: 'inv_2', name: 'Pump Leathers', qty: 0 },
                    { id: 'inv_3', name: '3-Piece Cap Gaskets', qty: 0 },
                    { id: 'inv_4', name: 'Check Valves (w/ stems)', qty: 0 },
                    { id: 'inv_5', name: 'T66 Generators (200A/242)', qty: 0 },
                    { id: 'inv_6', name: 'T33 Generators (220/228)', qty: 0 }
                ];
            }
        }

        // --- IMAGE COMPRESSOR (Prevents Cloud Bloat) ---
        function processAndCompressImage(event, type) {
            const file = event.target.files[0];
            if (!file) return;
            
            const reader = new FileReader();
            reader.onload = function(e) {
                const img = new Image();
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    const MAX_HEIGHT = 600; // Crunch down to 600px tall
                    let width = img.width;
                    let height = img.height;

                    if (height > MAX_HEIGHT) {
                        width = Math.round(width *= MAX_HEIGHT / height);
                        height = MAX_HEIGHT;
                    }
                    canvas.width = width; canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);
                    
                    // Compress heavily as JPEG to save cloud space (0.6 quality)
                    const dataUrl = canvas.toDataURL('image/jpeg', 0.6);
                    
                    if (type === 'primary') {
                        primaryPhotoDataUrl = dataUrl;
                        document.getElementById('gear-photo-preview').src = dataUrl;
                        document.getElementById('gear-photo-preview').classList.remove('hidden');
                        document.getElementById('gear-photo-placeholder').classList.add('hidden');
                    } else {
                        bottomPhotoDataUrl = dataUrl;
                        document.getElementById('gear-photo-preview-bottom').src = dataUrl;
                        document.getElementById('gear-photo-preview-bottom').classList.remove('hidden');
                        document.getElementById('gear-photo-placeholder-bottom').classList.add('hidden');
                    }
                }
                img.src = e.target.result;
            }
            reader.readAsDataURL(file);
        }

        function checkColemanBrain() {
            const input = document.getElementById('gear-model').value.trim().toLowerCase();
            const brainDiv = document.getElementById('brain-specs');
            
            let matchedSpec = null;
            for (const [key, spec] of Object.entries(colemanBrain)) {
                if (input.includes(key)) {
                    matchedSpec = spec;
                    break;
                }
            }

            if (matchedSpec) {
                document.getElementById('brain-gen').innerText = matchedSpec.gen;
                document.getElementById('brain-fuel').innerText = matchedSpec.fuel;
                document.getElementById('brain-mantle').innerText = matchedSpec.mantle;
                document.getElementById('brain-notes').innerText = matchedSpec.notes;
                brainDiv.classList.remove('hidden');
                return matchedSpec;
            } else {
                brainDiv.classList.add('hidden');
                return null;
            }
        }

        // --- CORE LOGIC ---
        async function saveNewGear() {
            const id = 'gear_' + Date.now();
            let owner = document.getElementById('gear-owner').value.trim() || "COKER GEAR";
            const specs = checkColemanBrain(); 
            
            // Gather selected repair tags
            const selectedTags = Array.from(document.querySelectorAll('.repair-tag.selected-tag')).map(btn => btn.innerText);
            
            const gearData = {
                id: id,
                model: document.getElementById('gear-model').value.trim(),
                month: document.getElementById('gear-month').value.trim(),
                year: document.getElementById('gear-year').value.trim(),
                owner: owner,
                priority: document.getElementById('gear-priority').checked,
                notes: document.getElementById('gear-notes').value.trim(),
                opStatus: document.getElementById('gear-op-status').value,
                repairTags: selectedTags, // Save tags
                photo: primaryPhotoDataUrl,
                bottomPhoto: bottomPhotoDataUrl,
                specs: specs
            };

            window.myCollection.unshift(gearData);
            
            // Clear Form
            document.getElementById('gear-model').value = '';
            document.getElementById('gear-month').value = '';
            document.getElementById('gear-year').value = '';
            document.getElementById('gear-notes').value = '';
            document.getElementById('gear-owner').value = 'COKER GEAR';
            document.getElementById('gear-priority').checked = false;
            document.getElementById('gear-op-status').value = 'Intake / In Queue';
            
            document.getElementById('gear-photo-preview').classList.add('hidden');
            document.getElementById('gear-photo-preview').src = '';
            document.getElementById('gear-photo-placeholder').classList.remove('hidden');
            
            document.getElementById('gear-photo-preview-bottom').classList.add('hidden');
            document.getElementById('gear-photo-preview-bottom').src = '';
            document.getElementById('gear-photo-placeholder-bottom').classList.remove('hidden');
            
            document.getElementById('gear-photo-upload').value = '';
            document.getElementById('gear-photo-upload-bottom').value = '';
            
            // Reset Repair Tags visually
            document.querySelectorAll('.repair-tag.selected-tag').forEach(el => toggleRepairTag(el));
            
            document.getElementById('brain-specs').classList.add('hidden');
            primaryPhotoDataUrl = null;
            bottomPhotoDataUrl = null;

            renderCollection();
            closeAddGearModal();
            showToast("Gear Logged!");
            await syncToCloud(); // Save to Cloud
        }

        async function duplicateGear(id) {
            const itemToCopy = window.myCollection.find(i => i.id === id);
            if(itemToCopy) {
                const newItem = { ...itemToCopy, id: 'gear_' + Date.now() };
                window.myCollection.unshift(newItem);
                renderCollection();
                showToast("Item Duplicated! Edit to update details.");
                await syncToCloud();
            }
        }

        async function deleteGear(id) {
            if(confirm("Delete this gear?")) {
                window.myCollection = window.myCollection.filter(i => i.id !== id);
                renderCollection();
                showToast("Item Deleted.");
                await syncToCloud(); // Save to Cloud
            }
        }

        function renderCollection() {
            const container = document.getElementById('collection-container');
            container.innerHTML = '';
            
            const searchTerm = (document.getElementById('inventory-search').value || '').toLowerCase();
            const filteredCollection = window.myCollection.filter(item => {
                const tagString = (item.repairTags || []).join(' ').toLowerCase();
                return (item.model || '').toLowerCase().includes(searchTerm) ||
                       (item.owner || '').toLowerCase().includes(searchTerm) ||
                       (item.opStatus || '').toLowerCase().includes(searchTerm) ||
                       (item.notes || '').toLowerCase().includes(searchTerm) ||
                       tagString.includes(searchTerm);
            });

            document.getElementById('item-count').innerText = filteredCollection.length;
            
            filteredCollection.forEach(item => {
                const ownerBadge = item.owner === 'COKER GEAR' ? 'bg-wood-800 text-white' : 'bg-amber-500 text-black';
                const prio = item.priority ? `<div class="absolute -top-2 -left-2 bg-red-600 text-white text-[10px] px-2 py-1 rounded-full animate-pulse z-10 font-bold border-2 border-white shadow-lg">RUSH JOB</div>` : '';
                
                let ageString = 'Unknown Age';
                if(item.month && item.year) {
                    let fullYear = parseInt(item.year);
                    if (!isNaN(fullYear)) {
                        if (fullYear < 100) fullYear += (fullYear < 50) ? 2000 : 1900; 
                        const age = new Date().getFullYear() - fullYear;
                        const monthNames = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
                        const mName = monthNames[parseInt(item.month)-1] || item.month;
                        ageString = `${mName} ${fullYear} (${age} yrs)`;
                    }
                }

                let imgHTML = '';
                if(item.photo) {
                    imgHTML = `<div class="w-full h-40 bg-black rounded relative mb-3 overflow-hidden border border-wood-700">
                                   <img src="${item.photo}" class="w-full h-full object-contain">
                                   ${item.bottomPhoto ? `<img src="${item.bottomPhoto}" class="absolute bottom-1 right-1 w-12 h-12 border-2 border-white rounded shadow-lg object-contain bg-black">` : ''}
                               </div>`;
                }
                
                let tagsHTML = '';
                if (item.repairTags && item.repairTags.length > 0) {
                    tagsHTML = '<div class="flex flex-wrap gap-1 mt-3 mb-1 border-t border-wood-600/50 pt-2">';
                    item.repairTags.forEach(tag => {
                        tagsHTML += `<span class="text-[9px] bg-red-900 text-red-100 px-1.5 py-0.5 rounded shadow-inner uppercase tracking-widest font-black flex items-center gap-1"><svg class="w-3 h-3 text-red-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path></svg>${tag}</span>`;
                    });
                    tagsHTML += '</div>';
                }

                container.innerHTML += `
                    <div class="bg-wood-100 rounded-lg shadow-md border-2 border-wood-400 p-4 relative card-texture">
                        ${prio}
                        <div class="flex justify-between items-start mb-2">
                            <h3 class="text-xl font-slab font-black text-wood-900">${item.model || 'Unknown'}</h3>
                            <div class="flex gap-2">
                                <button onclick="duplicateGear('${item.id}')" class="text-wood-600 hover:text-blue-600 transition-colors" title="Duplicate"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"></path></svg></button>
                                <button onclick="deleteGear('${item.id}')" class="text-wood-600 hover:text-red-600 transition-colors" title="Delete"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg></button>
                            </div>
                        </div>
                        ${imgHTML}
                        <div class="flex justify-between items-center mb-2">
                            <span class="text-xs font-bold ${ownerBadge} px-2 py-1 rounded shadow-sm">${item.owner}</span>
                            <span class="text-xs font-black text-wood-800 dark:text-wood-200">${ageString}</span>
                        </div>
                        <p class="text-xs font-bold text-blue-800 mb-2 uppercase tracking-wide">${item.opStatus}</p>
                        ${item.specs ? `
                            <div class="bg-wood-800 text-wood-300 text-[10px] p-2 rounded mb-2 uppercase tracking-wide border border-wood-600 shadow-inner flex flex-wrap gap-2">
                                <div><span class="text-wood-500">GEN:</span> <span class="text-white font-bold">${item.specs.gen}</span></div>
                                <div><span class="text-wood-500">FUEL:</span> <span class="text-white font-bold">${item.specs.fuel}</span></div>
                                <div><span class="text-wood-500">MANTLE:</span> <span class="text-white font-bold">${item.specs.mantle}</span></div>
                            </div>
                        ` : ''}
                        ${tagsHTML}
                        ${item.notes ? `<p class="text-sm italic border-l-2 border-wood-400 pl-2 mt-2 text-wood-800 dark:text-wood-300">"${item.notes}"</p>` : ''}
                    </div>`;
            });
        }

        // --- INVENTORY LOGIC ---
        async function addInventoryPart() {
            const name = document.getElementById('new-part-name').value.trim();
            const qty = parseInt(document.getElementById('new-part-qty').value) || 0;
            if (name) {
                window.shopInventory.push({ id: 'inv_' + Date.now(), name, qty });
                renderInventory();
                document.getElementById('new-part-name').value = '';
                await syncToCloud();
            }
        }

        async function updatePartQty(id, change) {
            const part = window.shopInventory.find(p => p.id === id);
            if (part) {
                part.qty = Math.max(0, part.qty + change);
                renderInventory();
                await syncToCloud();
            }
        }

        function renderInventory() {
            const list = document.getElementById('parts-inventory-list');
            list.innerHTML = '';
            window.shopInventory.forEach(part => {
                const text = part.qty === 0 ? 'text-red-700' : 'text-wood-900';
                list.innerHTML += `
                    <div class="flex items-center justify-between p-4 rounded-lg border-2 border-wood-300 bg-wood-200">
                        <h4 class="font-bold text-lg ${text}">${part.name} ${part.qty === 0 ? '(OUT)' : ''}</h4>
                        <div class="flex items-center gap-3">
                            <button onclick="updatePartQty('${part.id}', -1)" class="w-10 h-10 bg-wood-300 rounded font-black">-</button>
                            <span class="w-8 text-center font-black">${part.qty}</span>
                            <button onclick="updatePartQty('${part.id}', 1)" class="w-10 h-10 bg-wood-300 rounded font-black">+</button>
                        </div>
                    </div>`;
            });
        }

        // --- UI UTILS ---
        function exportCSV() {
            let csv = "Model,Month,Year,Owner,Priority,Status,Repairs_Needed,Notes\n";
            window.myCollection.forEach(item => {
                const tagsStr = item.repairTags ? item.repairTags.join('; ') : '';
                csv += `"${item.model||''}","${item.month||''}","${item.year||''}","${item.owner||''}","${item.priority?'Yes':'No'}","${item.opStatus||''}","${tagsStr}","${(item.notes||'').replace(/"/g, '""')}"\n`;
            });
            const blob = new Blob([csv], { type: 'text/csv' });
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.setAttribute('href', url);
            a.setAttribute('download', 'Coker_Shop_Inventory.csv');
            a.click();
            showToast("CSV Downloaded!");
        }

        function showToast(msg) {
            const t = document.createElement('div');
            t.className = 'bg-wood-900 text-wood-100 px-6 py-3 rounded-xl border-2 border-wood-600 font-black text-sm toast-enter';
            t.innerText = msg;
            document.getElementById('toast-container').appendChild(t);
            setTimeout(() => { t.style.opacity = '0'; setTimeout(() => t.remove(), 300); }, 3000);
        }
        function openAddGearModal() { document.getElementById('add-gear-modal').classList.remove('hidden'); }
        function closeAddGearModal() { document.getElementById('add-gear-modal').classList.add('hidden'); }
        function switchTab(t) {
            ['collection', 'parts'].forEach(tab => {
                document.getElementById(`tab-${tab}`).className = t === tab ? 'tab-active pb-3 px-2' : 'tab-inactive pb-3 px-2';
                document.getElementById(`section-${tab}`).style.display = t === tab ? 'block' : 'none';
            });
        }
    </script>
